name: nascar_sponsor_value
on:
  push:
    paths: ["nascar_sponsor_value/**", ".github/workflows/nascar_sponsor_value.yml"]
  pull_request:
    paths: ["nascar_sponsor_value/**"]
jobs:
  build-test-notebooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nascar_sponsor_value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: make all
      - run: make notebooks
